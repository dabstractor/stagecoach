# .goreleaser.yaml — Stagecoach release config (goreleaser v2). PRD §21.2.
# Docs: https://goreleaser.com/customization/
# Validate: `goreleaser check`  then  `goreleaser release --snapshot --clean` (publishes NOTHING).
#
# Owner note: uses `dabstractor/stagecoach` (+ dabstractor/homebrew-stagecoach, dabstractor/stagecoach-bucket) per PRD §21.2/§21.3
# and the go.mod module path (github.com/dabstractor/stagecoach). See PRP "Namespace decision tree": the
# current git remote is `dabstractor/stagecoach`; before the first REAL tag the repo must be reachable
# at github.com/dabstractor/stagecoach (or the namespace is reconciled repo-wide). Snapshot validation is
# unaffected (it publishes nothing).
version: 2

project_name: stagecoach

# Optional hygiene. Safe for a clean module; remove if it ever errors offline.
before:
  hooks:
    - go mod tidy

builds:
  - id: stagecoach
    main: ./cmd/stagecoach          # matches Makefile MAIN_PKG; cmd/stagecoach/main.go has `var version`
    binary: stagecoach              # name INSIDE the archive
    env:
      - CGO_ENABLED=0              # REQUIRED: static cross-compile (no C cross-compiler on CI). CRITICAL #2.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -> exactly 6 targets: linux/darwin/windows × amd64/arm64 (PRD §21.2/G9). No 32-bit ARM/MIPS -> no goarm/gomips.
    ldflags:
      - -s -w -X main.version={{.Version}}   # PRD §21.1. {{.Version}} = tag without leading "v" (e.g. 1.0.0).

archives:
  - id: default
    ids:
      - stagecoach                  # references builds[0].id
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # e.g. stagecoach_1.0.0_linux_amd64.tar.gz / stagecoach_1.0.0_windows_amd64.zip
    formats:
      - tar.gz                     # DECISION GATE: if `goreleaser check` rejects `formats`, use `format: tar.gz`.
    format_overrides:
      - goos: windows
        formats:
          - zip                    # windows -> zip; everything else -> tar.gz.

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^release:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: dabstractor                  # explicit; WINS over git-remote auto-detect (which is `dabstractor`).
    name: stagecoach
  draft: false
  prerelease: auto                 # prerelease if the tag looks like a pre-release (e.g. -rc1).
  # ── Distribution surface (PRD §21.2/§21.3) ─────────────────────────────────────────────────
  # This GitHub Release is the SINGLE source every install channel fetches from. goreleaser publishes
  # its NATIVE pipes here only — Homebrew (`brews:` below), Scoop (`scoops:` below), AUR (`aurs:`
  # below, best-effort) — plus the 6 archives + checksums.txt. The REMAINING channels are
  # "Beyond goreleaser" (PRD §21.2), implemented as separate CI/release artifacts, NOT goreleaser pipes:
  #   • npm       — release.yml `npm-publish` job → stagecoach-ai (npm/ wrapper)
  #   • Chocolatey — goreleaser-native `chocolateys:` pipe (Windows package manager; see below)
  #   • Nix       — flake.nix (nix profile install github:dabstractor/stagecoach)
  #   • mise/asdf — plugins/asdf-stagecoach/ (one POSIX-sh plugin serves both; see docs/packaging.md)
  # `go install` and the curl|sh direct download consume the archives published here directly.

# Homebrew formula (brews:). stagecoach is a CLI binary, so it ships as a Homebrew formula
# (installed to $HOMEBREW_PREFIX/bin, on $PATH), NOT a cask (casks are for macOS GUI .app bundles
# installed to /Applications). `brews:` is the current, non-deprecated field in goreleaser v2.
# Users install with: brew install dabstractor/stagecoach/stagecoach
# (Homebrew is a goreleaser-native pipe; the "Beyond goreleaser" channels — npm/Nix/mise-asdf —
#  are listed under `release:` above.)
brews:
  - repository:
      owner: dabstractor
      name: homebrew-stagecoach    # tap repo github.com/dabstractor/homebrew-stagecoach (project-named → tap = dabstractor/stagecoach)
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'   # fine-grained PAT, contents:write on the tap repo
    homepage: https://github.com/dabstractor/stagecoach
    description: 'Snapshot-based AI commit message generator that uses YOUR local CLI agent'
    license: MIT                   # ADJUST to the repo's actual license if different.
    install: |
      bin.install "stagecoach"

scoops:
  - name: stagecoach
    ids:
      - default
    # Scoop is a goreleaser-native pipe; the "Beyond goreleaser" channels (npm/Nix/mise-asdf)
    # are listed under `release:` above.
    repository:
      owner: dabstractor
      name: stagecoach-bucket      # bucket repo github.com/dabstractor/stagecoach-bucket (project-named)
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    homepage: https://github.com/dabstractor/stagecoach
    description: 'Snapshot-based AI commit message generator that uses YOUR local CLI agent'
    license: MIT                   # ADJUST to the repo's actual license if different.
    url_template: 'https://github.com/dabstractor/stagecoach/releases/download/{{ .Tag }}/{{ .ArtifactName }}'

# .deb + .rpm — native Linux packages via goreleaser's nfpm pipe (PRD §21.2/§21.3; v3.1/G28).
# Produces stagecoach_<v>_linux_{amd64,arm64}.{deb,rpm} in every Release (nfpm maps goarch to the distro
# arch internally: amd64->amd64/x86_64, arm64->arm64/aarch64). Installs to /usr/bin (bindir). NO apt/dnf
# repo — GitHub-Release assets, so the PM updaters cannot fetch a new version; `stagecoach upgrade`
# detects deb/rpm (FR-U2) and prints the manual reinstall recipe (FR-U3) instead of self-swapping the
# PM-owned /usr/bin/stagecoach (FR-U1).
nfpms:
  - id: stagecoach
    package_name: stagecoach            # the dpkg/rpm package name; matches `dpkg -s stagecoach` / `rpm -q stagecoach` (FR-U2)
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # (builds auto-selected by goreleaser nfpm; the linux builds are packaged — darwin/windows are
    # skipped for the deb/rpm formats. `builds:` is deprecated: goreleaser.com/deprecations#nfpmsbuilds)
    formats:
      - deb
      - rpm
    vendor: dabstractor
    homepage: https://github.com/dabstractor/stagecoach
    maintainer: 'Dustin Schultz <dustindschultz@gmail.com>'
    description: 'Snapshot-based AI commit message generator that uses YOUR local CLI agent'
    license: MIT
    bindir: /usr/bin                    # matches the deb/rpm FR-U2 detection assumption (/usr/bin/stagecoach)

# AUR — BEST-EFFORT (PRD §21.2; contract LOGIC bullets don't list AUR, so this is nice-to-have).
# Native pipe produces the PKGBUILD for `stagecoach-bin`, pushed over SSH (NOT a PAT). goreleaser v2
# AUTO-APPENDS the `-bin` suffix to AUR names (documented, non-configurable) — `name: stagecoach-bin`
# stays `stagecoach-bin` (no double suffix); bare `stagecoach` is unobtainable via goreleaser.
# A future from-source/git `stagecoach-git` variant is a possible community package — out of scope now.
# (AUR is a goreleaser-native pipe; the "Beyond goreleaser" channels — npm/Nix/mise-asdf —
#  are listed under `release:` above.)
# DECISION GATE: if `goreleaser check` rejects any field below, COMMENT OUT this whole `aurs:` block and
# ship the rest (brew+scoop+checksum+changelog+archives). AUR does not block the core contract.
aurs:
  - name: stagecoach-bin           # goreleaser v2 enforces the `-bin` suffix — this IS the final package name
    ids:
      - default
    homepage: https://github.com/dabstractor/stagecoach
    description: 'Snapshot-based AI commit message generator that uses YOUR local CLI agent'
    maintainers:
      - 'Dustin Schultz <dustindschultz@gmail.com>'
    license: MIT
    depends:
      - git
    provides:
      - stagecoach                 # `yay -S stagecoach` resolves to this package
    conflicts:
      - stagecoach                 # conflicts with a hypothetical from-source `stagecoach` package
    private_key: '{{ .Env.AUR_SSH_PRIVATE_KEY }}'   # SSH private key whose pubkey is on the AUR account
    # TEMPORARY (2026-08): aur.archlinux.org is down (malware incident). git_url commented out so
    # goreleaser SKIPS the AUR publish ("url is empty") instead of failing the release job on a
    # dead host. REVERT (uncomment the line below) once AUR is back.
    # git_url: ssh://aur@aur.archlinux.org/stagecoach-bin.git   # REQUIRED AUR git SSH push target — without it goreleaser skips the publish ("url is empty")
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

# Chocolatey (Windows package manager) — goreleaser-native `chocolateys:` pipe (PRD §21.2/G27).
# Publishes a .nupkg to the community repo (chocolatey.org) so `choco install stagecoach` /
# `choco upgrade stagecoach` work. Chosen for the Windows package-manager audience; the previous
# Windows store channel was dropped (its repo ran a Microsoft Defender install-gate that hard-blocked
# the unsigned binary every release; Chocolatey does not). `choco upgrade` needs admin, so
# `stagecoach upgrade` detects a Chocolatey install (FR-U2) and PRINTs `choco upgrade stagecoach -y`
# (FR-U4; do NOT self-swap — FR-U1: choco owns the binary under ProgramData\chocolatey).
# DECISION GATE: if `goreleaser check` rejects any field below, COMMENT OUT that field and ship the
# rest (same pattern as the `aurs:` block above).
chocolateys:
  - name: stagecoach
    ids:
      - default
    owners: dabstractor
    title: Stagecoach
    authors: dabstractor
    project_url: https://github.com/dabstractor/stagecoach
    url_template: 'https://github.com/dabstractor/stagecoach/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
    license_url: 'https://github.com/dabstractor/stagecoach/blob/main/LICENSE'
    copyright: 'Copyright 2026 dabstractor'
    description: 'Snapshot-based AI commit message generator that uses YOUR local CLI agent'
    release_notes: 'https://github.com/dabstractor/stagecoach/releases/tag/{{ .Tag }}'
    api_key: '{{ .Env.CHOCOLATEY_API_KEY }}'
    source_repo: 'https://push.chocolatey.org/'
