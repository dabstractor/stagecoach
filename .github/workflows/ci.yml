# .github/workflows/ci.yml — Stagecoach CI (PRD §20.4 build/test matrix + §20.3 coverage gate).
# Scope NOTE: release-on-tag via goreleaser lives in a SEPARATE workflow owned by P1.M5.T3.S2.
# Triggers: push(main) + pull_request + manual workflow_dispatch. The workflow_dispatch
# trigger is for the validation agent to run CI against a non-main branch via
# `gh workflow run ci.yml --ref <branch>` (see docs/ci-validation.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (only auto-cancel for PRs; let main runs finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- (1) Build + race-enabled tests across the os x Go matrix -----------------
  build-test:
    name: test (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20         # Hard backstop. go test's own -timeout only fires in-process; a
                               # stalled test binary / OS crash-reporter can bypass it (this is what
                               # hung deprecated macos-13 for 24h). Keep all matrix jobs bounded.
    strategy:
      fail-fast: false
      matrix:
        # Native TEST runners for PRD §20.4 — only platforms whose test suite is designed to execute
        # on them are exercised with `go test -race`:
        #   ubuntu-latest  = linux/amd64   (primary dev platform; full race-enabled suite)
        #   macos-latest   = macos/arm64   (Apple Silicon)
        #
        # Go toolchain floor is 1.24: macos-latest now runs macOS 26 (Tahoe), whose dyld rejects
        # Go <1.24 binaries missing the LC_UUID load command (golang/go#78012, fixed in Go 1.24).
        # Go 1.22/1.23 crash instantly on macos-latest with `dyld: missing LC_UUID load command`.
        #
        # Intentionally NOT in the matrix (still first-class release targets — see cross-build):
        #   macos-13       = macos/amd64 (Intel) — runner deprecated by GitHub; stalled 24h under
        #                   -race. darwin/amd64 is compile-checked in the cross-build step instead.
        #   windows-latest runs the full -race suite natively (windows/amd64); windows/arm64 is
        #                   compile-checked in the cross-build step (no arm64 Windows runner). The
        #                   suite is cross-platform: shell-script fixtures use compiled stubs, git
        #                   hooks route #!/bin/sh through MSYS sh, and Windows-only behaviors
        #                   (flock no-op, no executable bit) are handled where they differ.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true            # auto-keyed on go.sum
      - name: Build
        run: go build ./...
      - name: Cross-build all non-native release targets
        # Compile-checks every goreleaser target that is not the host's native (os,arch), so all 6
        # release targets (PRD §21.2/G9) are verified without paying for QEMU test emulation.
        # CGO_ENABLED=0 matches .goreleaser.yaml: no C cross-toolchain needed, reproducible from
        # any host. Covers linux/arm64, darwin/{amd64,arm64}, windows/arm64 (windows/amd64 is built
        # + race-tested natively by the windows-latest matrix job).
        # shell: bash — the loop uses bash syntax (for…do, ${pair%/*}); pin it so the step also works
        # on windows-latest, whose default shell is PowerShell (which rejects this syntax).
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          for pair in linux/arm64 darwin/amd64 darwin/arm64 windows/arm64; do
            goos=${pair%/*}; goarch=${pair#*/}
            echo "::group::GOOS=$goos GOARCH=$goarch"
            GOOS=$goos GOARCH=$goarch go build ./...
            echo "::endgroup::"
          done
      - name: Test (race)
        run: go test -race ./...

  # --- (2) golangci-lint (single ubuntu job — faster, no windows-lint flake) ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m

  # --- (3) govulncheck (single ubuntu job) -------------------------------------
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version: '1.22'
          go-package: ./...

  # --- (4) Coverage gate (PRD §20.3: >=85% on the 4 core packages) -------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Generate coverage
        # Per-package OWN-TESTS coverage (the standard interpretation of §20.3). NOT -coverpkg.
        run: go test -coverprofile=coverage.out ./...
      - name: Enforce >=85% on internal/{git,provider,generate,config}
        # Self-contained, statement-weighted gate. No third-party action, no Make dependency.
        # threshold (PRD §20.3 = 85). If you ratchet a package (see "Coverage-gap decision tree"),
        # give it a per-package floor below instead of lowering this global threshold.
        run: |
          awk '
            /^mode:/ {next}
            {
              f=$1; sub(/:[0-9]+.*$/,"",f);            # f = pkgpath/file.go
              n=split(f,p,"/"); pkg=""; for(i=1;i<n;i++){pkg=pkg (i>1?"/":"") p[i]}
              tot[pkg]+=$2; if($3+0>0) cov[pkg]+=$2    # $2=numStatements, $3=hitCount
            }
            END{
              threshold=85
              t[1]="github.com/dabstractor/stagecoach/internal/git"
              t[2]="github.com/dabstractor/stagecoach/internal/provider"
              t[3]="github.com/dabstractor/stagecoach/internal/generate"
              t[4]="github.com/dabstractor/stagecoach/internal/config"
              fail=0
              for(i=1;i<=4;i++){
                if(!(t[i] in tot)){ printf("::error::%s — no coverage data\n",t[i]); fail=1; continue }
                pct=(tot[t[i]]>0)? cov[t[i]]/tot[t[i]]*100 : 0
                printf("%-55s %5.1f%%\n", t[i], pct)
                if(pct < threshold){ printf("::error::%s coverage %.1f%% < %d%%\n", t[i], pct, threshold); fail=1 }
              }
              exit fail
            }
          ' coverage.out

  # --- (5) npm wrapper smoke (PRD §21.2; S1 shim + S2 installer) -------------------
  # Catches npm-wrapper regressions on every PR BEFORE a release. Runs S1's npm/test/smoke.cjs
  # (shim: fake-cached binary -> exec + STAGECOACH_INSTALL_METHOD=npm + exit-code propagation +
  # the no-cache fallback) and S2's npm/test/install.test.cjs (installer: local fixture server
  # -> download + SHA256-verify + extract + checksum-mismatch abort-before-write).
  #
  # Platform notes:
  #   * smoke.cjs SKIPS win32 itself (S1's contract: the fake binary is not a real PE .exe), so on
  #     windows it is a no-op that prints 'skipped' and exits 0.
  #   * install.test.cjs is GATED to non-windows (see the step-level `if`): S2's test builds the
  #     fixture archive with tar.c({gzip:true}) ALWAYS — even when assetName ends in .zip (win32) —
  #     so on a windows runner install.cjs would call extractZip on a tar.gz stream and THROW,
  #     failing the happy-path assertion. The windows zip-extraction path is a DOCUMENTED GAP,
  #     pending a real-zip fixture from S2 / a future task.
  #   * windows-latest still adds value here: the syntax checks (`node --check`) + the deps-resolve
  #     (`npm install --ignore-scripts`) run there, catching OS-specific resolution regressions.
  npm-smoke:
    name: npm wrapper smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shim + installer syntax check
        run: |
          node --check npm/bin/stagecoach.js
          node --check npm/install.cjs
      - name: Fetch wrapper deps (no postinstall)
        # tar + extract-zip for S2's install.test.cjs. --ignore-scripts so install.cjs (postinstall)
        # does NOT run (the 0.0.0 dev guard would also skip it, but be explicit).
        working-directory: npm
        run: npm install --ignore-scripts
      - name: Shim smoke (fake-cached binary)
        # S1's smoke: places a fake binary in a temp cache, runs the shim, asserts exec + env tag +
        # exit-code propagation + the no-cache fallback. SKIPS on win32 (prints 'skipped', exit 0).
        run: node npm/test/smoke.cjs
      - name: Installer smoke (fixture server; tar.gz path)
        # S2's smoke: builds a fixture archive + checksums, serves via local http, asserts download +
        # SHA256-verify + extract + checksum-mismatch abort-before-write. GATED to non-windows
        # (S2's fixture is tar.gz even for .zip-named assets, so the windows zip path is uncovered).
        if: matrix.os != 'windows-latest'
        working-directory: npm
        run: node test/install.test.cjs

  # --- (6) Nix flake check (PRD §21.2; external_deps.md §5) -----------------------
  # Builds the flake's outputs for the current system (x86_64-linux). A stale vendorHash fails
  # here with a clear "got: sha256-..." mismatch — paste it into flake.nix (see the flake.nix
  # header comment for the vendorHash update workflow). No cachix for v3.0 (small Go static
  # binary; add later). continue-on-error is intentionally FALSE (default) so a stale vendorHash
  # fails the job and surfaces the got-hash — this is what keeps the Nix surface current.
  nix-flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: nix flake check (evaluate devShells + checks)
        run: nix --print-build-logs flake check
      - name: nix build .#default (hard gate — catches a stale vendorHash)
        # `nix flake check` only EVALUATES derivations, so it cannot catch a stale lib.fakeHash
        # vendorHash. Actually building the package enforces the go-modules fixed-output hash: if
        # go.mod/go.sum change, this step fails with the new `got:` hash to paste into flake.nix.
        # flake.lock (committed) pins nixpkgs so this build is reproducible across runs.
        run: nix --print-build-logs build .#default

  # --- (7) asdf/mise plugin smoke (PRD §21.2/G27; external_deps.md §6) --------------------
  # shellchecks the 3 POSIX-sh plugin scripts (catches bashisms) + runs the fixture-archive
  # smoke test (build a fake stagecoach archive, serve locally, run bin/install, assert the
  # happy path + the SHA256-mismatch abort-before-write). Keeps the plugin scripts from rotting
  # on every PR (parity with npm-smoke above + nix-flake-check). ubuntu-latest ships shellcheck
  # + python3 (FR-D5: re-confirmed in the runner pre-installed tool list).
  asdf-plugin-smoke:
    name: asdf/mise plugin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX sh plugin scripts)
        run: |
          shellcheck -s sh plugins/asdf-stagecoach/bin/list-all
          shellcheck -s sh plugins/asdf-stagecoach/bin/install
          shellcheck -s sh plugins/asdf-stagecoach/test/smoke.sh
      - name: smoke test (fixture archive install)
        working-directory: plugins/asdf-stagecoach
        run: sh test/smoke.sh
