# .github/workflows/release.yml — Release on tag via goreleaser (PRD §20.4, §21.2).
# Triggered ONLY on `v*` tags. CI (build/test/lint/coverage) lives in ci.yml (P1.M5.T3.S1).
# Required repo SECRETS (Settings → Secrets → Actions), needed ONLY for a REAL release (not for config
# validation; `goreleaser release --snapshot` publishes nothing):
#   HOMEBREW_TAP_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/homebrew-tap
#   SCOOP_BUCKET_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/scoop-bucket
#   AUR_SSH_PRIVATE_KEY        SSH private key for the AUR account (only if the `aurs:` block is kept)
#   NPM_TOKEN                  npm AUTOMATION token (npmjs.com → Access Tokens → "Automation";
#                              bypasses publish 2FA for non-interactive CI). Settings → Secrets → Actions.
#                              NOTE: use an AUTOMATION token, NOT a "Publish" token — a Publish token
#                              fails with "requires a one-time password" if the account has publish 2FA on.
#   WINGET_TOKEN                classic PAT, public_repo scope — forks microsoft/winget-pkgs to
#                              dabstractor/winget-pkgs + opens the manifest PR. Settings → Secrets → Actions.
# (GITHUB_TOKEN is auto-provided — no secret needed for the GitHub Release itself.)
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MANDATORY: goreleaser needs full history for the changelog.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to Go 1.24+, NOT go-version-file: go.mod (which resolves to the 1.22 directive).
          # macOS 26 (Tahoe) rejects Go <1.24 release binaries missing the LC_UUID load command
          # (golang/go#78012, fixed in Go 1.24) — they crash on launch for Homebrew users. The
          # release toolchain MUST therefore be >=1.24 even though the module's minimum is 1.22.
          go-version: '1.24'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest           # the goreleaser BINARY version (pin e.g. ~> v2 for reproducibility).
          # Homebrew + Scoop pipes are now ENABLED: the tap repo (dabstractor/homebrew-tap) and
          # bucket repo (dabstractor/scoop-bucket) + their PAT secrets (HOMEBREW_TAP_GITHUB_TOKEN,
          # SCOOP_BUCKET_GITHUB_TOKEN) are stood up per docs/packaging.md. AUR stays SKIPPED
          # (best-effort, PRD §21.2) until an AUR account + AUR_SSH_PRIVATE_KEY exist AND the
          # .goreleaser.yaml `aurs:` maintainers: line carries the real identity — then drop
          # `--skip=aur` here. GATING: tag only AFTER the tap/bucket repos + their secrets exist,
          # or this job fails cloning a nonexistent repo.
          args: release --clean --skip=aur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # --- npm wrapper publish (PRD §21.2 "Beyond goreleaser"; external_deps.md §3) ----------------
  # goreleaser has NO native npm pipe, so @dabstractor/stagecoach is published by a SEPARATE job.
  # `needs: goreleaser` ensures the GitHub Release (archives + checksums) EXISTS before users
  # `npm install` — the postinstall fetches the binary from that Release. Without `needs:` the two
  # jobs run concurrently and npm could publish before the Release exists, 404'ing early installers.
  npm-publish:
    name: Publish npm wrapper
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # default fetch-depth 1 is fine — npm-publish needs no changelog history

      - name: Set up Node 20 + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'        # contract; satisfies package.json engines.node (>=18)
          registry-url: 'https://registry.npmjs.org'   # writes ~/.npmrc auth line (NODE_AUTH_TOKEN resolved at publish step)

      - name: Sync package.json version from tag
        # The committed npm/package.json version is the 0.0.0 dev placeholder; the RELEASE version is
        # the tag without leading v (goreleaser {{.Version}}). Bump it TRANSIENTLY (no commit/tag);
        # `npm version --no-git-tag-version` skips all git ops INCLUDING the dirty-tree check, so it
        # is robust in a clean CI checkout.
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"   # refs/tags/v1.2.0 -> 1.2.0 ; v1.2.0-rc.1 -> 1.2.0-rc.1
          echo "Publishing @dabstractor/stagecoach@$VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Validate deps resolve (no postinstall, no lockfile)
        # --ignore-scripts: do NOT run postinstall (install.cjs would download the REAL binary — the
        #   publish ships JS ONLY; the binary is fetched at USER install time, not publish time).
        # --no-package-lock: do NOT create a lockfile (it would be included by npm pack/publish and
        #   pollute the published tarball).
        working-directory: npm
        run: npm install --ignore-scripts --no-package-lock

      - name: Publish to npm
        # --access public: REQUIRED — @dabstractor/stagecoach is scoped (scoped packages default to
        #   private/restricted; a bare `npm publish` is rejected or publishes privately).
        # NODE_AUTH_TOKEN is resolved from THIS step's env by the ~/.npmrc that setup-node wrote.
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- WinGet (Windows Package Manager) manifest automation (PRD §21.2/§21.3; external_deps §4) ---
  # vedantmgoyal9/winget-releaser@v2 opens a PR to microsoft/winget-pkgs per release, bumping the
  # PackageVersion + the windows_amd64.zip InstallerUrl/SHA256. Komac (the action's core) REUSES the
  # EXISTING manifest structure, so dabstractor.Stagecoach must be bootstrapped ONCE in winget-pkgs
  # first (see docs/packaging.md). Until then this step exits 1 (the action HEAD-checks the
  # PackageIdentifier) → continue-on-error keeps the first release green.
  winget:
    name: WinGet manifest PR (microsoft/winget-pkgs)
    needs: goreleaser           # the GitHub Release (windows zip + checksums) must exist first
    runs-on: windows-latest     # action is pwsh-native; matches the winget-releaser convention
    steps:
      - name: Open winget-pkgs manifest PR via WinGet Releaser
        # continue-on-error: BEST-EFFORT + FIRST-RELEASE GATE. The action exits 1 until
        # dabstractor.Stagecoach is bootstrapped in winget-pkgs (its first step HEAD-checks the
        # PackageIdentifier path). After bootstrap it succeeds; the gate is then a harmless safety
        # net (a winget-pkgs PR hiccup must never block a Go release).
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: dabstractor.Stagecoach   # PackageIdentifier: <Publisher>.<Product>
          # installers-regex: the action's DEFAULT (.(exe|msi|msix|appx)...) does NOT match .zip —
          # our goreleaser windows asset is stagecoach_<ver>_windows_amd64.zip. Override to match
          # exactly the x64 zip (Komac maps amd64→x64). PowerShell -match is .NET regex (escape .).
          installers-regex: 'windows_amd64\.zip$'
          # version: left UNSET — the action defaults to the tag without leading v (= goreleaser
          # {{.Version}}); they match. release-repository/release-tag/fork-user defaults are correct
          # for this trigger; fork-user is set explicitly for clarity.
          fork-user: dabstractor               # Komac forks microsoft/winget-pkgs → dabstractor/winget-pkgs
          max-versions-to-keep: '0'            # keep all versions (0 = keep all; the default)
          token: ${{ secrets.WINGET_TOKEN }}   # classic PAT, public_repo scope (NOT the default GITHUB_TOKEN)
