# .github/workflows/release.yml — Release on tag via goreleaser (PRD §20.4, §21.2).
# Triggered ONLY on `v*` tags. CI (build/test/lint/coverage) lives in ci.yml (P1.M5.T3.S1).
# Required repo SECRETS (Settings → Secrets → Actions), needed ONLY for a REAL release (not for config
# validation; `goreleaser release --snapshot` publishes nothing):
#   HOMEBREW_TAP_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/homebrew-stagecoach
#   SCOOP_BUCKET_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/stagecoach-bucket
#   ASDF_TOKEN                 fine-grained PAT, contents:write on dabstractor/asdf-stagecoach (mirrors the plugin)
#   AUR_SSH_PRIVATE_KEY        SSH private key for the AUR account (only if the `aurs:` block is kept)
#   NPM_TOKEN                  npm AUTOMATION token (npmjs.com → Access Tokens → "Automation";
#                              bypasses publish 2FA for non-interactive CI). Settings → Secrets → Actions.
#                              NOTE: use an AUTOMATION token, NOT a "Publish" token — a Publish token
#                              fails with "requires a one-time password" if the account has publish 2FA on.
#   CHOCOLATEY_API_KEY          Chocolatey community-source push key (chocolatey.org → Account Settings
#                              → API Key). Used by the goreleaser-native `chocolateys:` pipe (in
#                              .goreleaser.yaml) to publish the .nupkg to push.chocolatey.org.
#                              Settings → Secrets → Actions.
# (GITHUB_TOKEN is auto-provided — no secret needed for the GitHub Release itself.)
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MANDATORY: goreleaser needs full history for the changelog.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to Go 1.24+, NOT go-version-file: go.mod (which resolves to the 1.22 directive).
          # macOS 26 (Tahoe) rejects Go <1.24 release binaries missing the LC_UUID load command
          # (golang/go#78012, fixed in Go 1.24) — they crash on launch for Homebrew users. The
          # release toolchain MUST therefore be >=1.24 even though the module's minimum is 1.22.
          go-version: '1.24'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest           # the goreleaser BINARY version (pin e.g. ~> v2 for reproducibility).
          # Homebrew + Scoop pipes are now ENABLED: the tap repo (dabstractor/homebrew-stagecoach) and
          # Homebrew + Scoop + AUR pipes are all ENABLED: the tap (dabstractor/homebrew-stagecoach),
          # bucket (dabstractor/stagecoach-bucket), and AUR (`stagecoach` via AUR_SSH_PRIVATE_KEY) +
          # their secrets are stood up per docs/packaging.md. No `--skip` flags remain. GATING: tag
          # only AFTER the tap/bucket/AUR targets + their secrets exist, or this job fails cloning.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  # --- npm wrapper publish (PRD §21.2 "Beyond goreleaser"; external_deps.md §3) ----------------
  # goreleaser has NO native npm pipe, so stagecoach-ai is published by a SEPARATE job.
  # `needs: goreleaser` ensures the GitHub Release (archives + checksums) EXISTS before users
  # `npm install` — the postinstall fetches the binary from that Release. Without `needs:` the two
  # jobs run concurrently and npm could publish before the Release exists, 404'ing early installers.
  npm-publish:
    name: Publish npm wrapper
    needs: goreleaser
    if: ${{ !cancelled() }}   # run even if goreleaser's post-publish AUR step failed (the Release is already up)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # default fetch-depth 1 is fine — npm-publish needs no changelog history

      - name: Set up Node 20 + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'        # contract; satisfies package.json engines.node (>=18)
          registry-url: 'https://registry.npmjs.org'   # writes ~/.npmrc auth line (NODE_AUTH_TOKEN resolved at publish step)

      - name: Sync package.json version from tag
        # The committed npm/package.json version is the 0.0.0 dev placeholder; the RELEASE version is
        # the tag without leading v (goreleaser {{.Version}}). Bump it TRANSIENTLY (no commit/tag);
        # `npm version --no-git-tag-version` skips all git ops INCLUDING the dirty-tree check, so it
        # is robust in a clean CI checkout.
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"   # refs/tags/v1.2.0 -> 1.2.0 ; v1.2.0-rc.1 -> 1.2.0-rc.1
          echo "Publishing stagecoach-ai@$VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Validate deps resolve (no postinstall, no lockfile)
        # --ignore-scripts: do NOT run postinstall (install.cjs would download the REAL binary — the
        #   publish ships JS ONLY; the binary is fetched at USER install time, not publish time).
        # --no-package-lock: do NOT create a lockfile (it would be included by npm pack/publish and
        #   pollute the published tarball).
        working-directory: npm
        run: npm install --ignore-scripts --no-package-lock

      - name: Publish to npm
        # The package is UNSCOPED (stagecoach-ai) — public by default, so no `--access` flag is needed
        # (that flag is scoped-packages-only). If the package is ever re-scoped, re-add `--access public`.
        # NODE_AUTH_TOKEN is resolved from THIS step's env by the ~/.npmrc that setup-node wrote.
        working-directory: npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- asdf / mise plugin mirror (PRD §21.2/§21.3; G27) ----------------------------------------
  # The asdf plugin's single source of truth is plugins/asdf-stagecoach/ in THIS repo. asdf/mise
  # require bin/install + bin/list-all at the ROOT of the plugin's own git repo (they clone it
  # whole), so a separate repo (dabstractor/asdf-stagecoach) is unavoidable. Rather than a fragile
  # git submodule (forces --recurse-submodules on every CI/contributor clone; couples the main repo
  # to a pinned aux-repo commit; and is inconsistent with how Homebrew/Scoop are handled), this job
  # MIRRORS plugins/asdf-stagecoach/* to the root of dabstractor/asdf-stagecoach on every release.
  # The aux repo is a read-only, never-hand-edited mirror → exactly ONE source of truth. This is the
  # same "source here, generated there" architecture as the goreleaser-native Homebrew/Scoop pipes.
  asdf-mirror:
    name: Mirror asdf plugin → dabstractor/asdf-stagecoach
    needs: goreleaser
    if: ${{ !cancelled() }}   # run even if goreleaser's post-publish AUR step failed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror plugins/asdf-stagecoach to the plugin repo root
        env:
          ASDF_TOKEN: ${{ secrets.ASDF_TOKEN }}   # fine-grained PAT, contents:write on dabstractor/asdf-stagecoach
          VERSION: ${{ github.ref_name }}          # vX.Y.Z — recorded in the mirror commit message
        run: |
          set -eu
          # Commit identity: github-actions[bot] on the MIRROR repo only (standard release-automation
          # identity — same kind of bot commit goreleaser makes to the Homebrew tap / Scoop bucket /
          # AUR; it does not touch the stagecoach source repo's commit metadata). AGENTS.md rule 3
          # (FR-39a) governs the source repo; this mirror commit is release plumbing.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CLONE_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${ASDF_TOKEN}@github.com/dabstractor/asdf-stagecoach.git" "$CLONE_DIR"
          # Replace the whole tree (catches deletions; leaves no stale files) except .git.
          find "$CLONE_DIR" -mindepth 1 -not -path '*.git*' -delete
          cp -a plugins/asdf-stagecoach/. "$CLONE_DIR/"
          cd "$CLONE_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "no plugin changes to mirror; skipping push"
            exit 0
          fi
          git commit -m "mirror stagecoach plugin ${VERSION} from dabstractor/stagecoach"
          git branch -M main     # normalize branch name (first-push-into-empty-repo safe)
          git push -u origin main

  # --- apt + dnf repo on GitHub Pages (PRD §21.2/§21.3) ------------------------
  # Hosts signed apt (Debian/Ubuntu) + dnf (Fedora/RHEL) repos as a static site on the `gh-pages`
  # branch, served at https://dabstractor.github.io/stagecoach/{apt,rpm}/. No external service.
  # apt: dists/stable/{InRelease,Release.gpg} signed by the stagecoach apt GPG key
  # (APT_GPG_PRIVATE_KEY; public half committed at apt-archive-keyring.asc). dnf: repodata via
  # createrepo_c (nfpm RPMs are not GPG-signed, so the repo ships gpgcheck=0). Accumulates versions:
  # the existing gh-pages is cloned, the new .deb/.rpm are added to the pool, and ALL metadata is
  # rebuilt + resigned every release (so Packages/Release always cover every published version).
  # ONE-TIME manual step: enable GitHub Pages (repo Settings → Pages → source: branch `gh-pages` / root).
  apt-dnf-repo:
    name: Publish apt + dnf repo → gh-pages
    needs: goreleaser
    if: ${{ !cancelled() }}   # run even if goreleaser's post-publish AUR step failed (Release is already up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repo tools (apt-utils, createrepo-c)
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c

      - name: Download .deb + .rpm from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/newpkgs
          gh release download "${{ github.ref_name }}" -R dabstractor/stagecoach -D /tmp/newpkgs -p '*.deb' -p '*.rpm'

      - name: Fetch existing gh-pages (so old versions accumulate)
        run: |
          if git clone --branch gh-pages --depth 1 "https://github.com/dabstractor/stagecoach.git" /tmp/repo 2>/dev/null; then
            rm -rf /tmp/repo/.git
          else
            mkdir -p /tmp/repo
          fi

      - name: Build + sign the apt + dnf repo
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          KEY_ID: F8E3C83C0071B25F69A6960E58549A92EB342930
        run: bash .github/scripts/build-apt-dnf-repo.sh /tmp/newpkgs /tmp/repo

      - name: Publish to gh-pages
        run: |
          cd /tmp/repo
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apt + dnf repo update for ${{ github.ref_name }}" || echo "nothing to commit"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dabstractor/stagecoach.git" gh-pages
