# .github/workflows/release.yml — Release on tag via goreleaser (PRD §20.4, §21.2).
# Triggered ONLY on `v*` tags. CI (build/test/lint/coverage) lives in ci.yml (P1.M5.T3.S1).
# Required repo SECRETS (Settings → Secrets → Actions), needed ONLY for a REAL release (not for config
# validation; `goreleaser release --snapshot` publishes nothing):
#   HOMEBREW_TAP_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/homebrew-tap
#   SCOOP_BUCKET_GITHUB_TOKEN  fine-grained PAT, contents:write on dabstractor/scoop-bucket
#   AUR_SSH_PRIVATE_KEY        SSH private key for the AUR account (only if the `aurs:` block is kept)
# (GITHUB_TOKEN is auto-provided — no secret needed for the GitHub Release itself.)
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MANDATORY: goreleaser needs full history for the changelog.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to Go 1.24+, NOT go-version-file: go.mod (which resolves to the 1.22 directive).
          # macOS 26 (Tahoe) rejects Go <1.24 release binaries missing the LC_UUID load command
          # (golang/go#78012, fixed in Go 1.24) — they crash on launch for Homebrew users. The
          # release toolchain MUST therefore be >=1.24 even though the module's minimum is 1.22.
          go-version: '1.24'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest           # the goreleaser BINARY version (pin e.g. ~> v2 for reproducibility).
          # FIRST-RELEASE (v0.1.0): skip the Homebrew/Scoop/AUR distribution pipes. They require the
          # target repos (dabstractor/homebrew-tap, dabstractor/scoop-bucket) + their PAT secrets
          # (HOMEBREW_TAP_GITHUB_TOKEN, SCOOP_BUCKET_GITHUB_TOKEN) and AUR_SSH_PRIVATE_KEY, none of
          # which exist yet (README §install: "These will land ... once the tap/bucket repos are
          # published"). This release ships the GitHub Release with all 6 platform archives +
          # checksums + changelog. REMOVE `--skip=homebrew,scoop,aur` once that infrastructure exists.
          args: release --clean --skip=homebrew,scoop,aur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
